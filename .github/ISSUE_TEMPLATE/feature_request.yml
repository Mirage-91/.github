name: Feature / idea
description: Suggest a new feature, pipeline improvement, or project idea
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Offline pipeline (preprocessing, features, classifiers, training)
        - Online pipeline / live streaming / game connector
        - Notebooks / tutorials
        - New project
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Motivation
      description: What problem does this solve, or what would it make possible? (e.g. better accuracy, lower latency, new paradigm)
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe what you'd like to add or change. Links to papers or methods are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about.

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd like to work on this myself
